project:
  type: book

book:
  title: "SDR with GNU Radio"
  subtitle: "A Practical, Experiment-Driven Introduction to Software Defined Radio"
  author: "Dhrubjun Nath Saikia"

  repo-url: https://github.com/dhrubjun/sdr-with-gnu-radio
  repo-actions: [source]

  search: true

  chapters:
    - text: "Home"
      file: index.md

    - part: "Part I: Learning to Think in Signals"
      chapters:
        - book/01-what-is-software-defined-radio.md
        - book/02-understanding-signals.md
        - book/03-sampling-and-aliasing.md
        - book/04-complex-numbers.md
        - book/05-i-q-signals.md

    - part: "Part II: Seeing What Is Inside a Signal"
      chapters:
        - book/06-time-domain-to-frequency-domain.md
        - book/07-noise-and-snr.md

    - part: "Part III: Moving and Shaping Signals"
      chapters:
        - book/08-mixture-and-frequency-translation.md
        - book/09-filters-and-channel-selection.md
        - book/10-impulse-response-and-convolution.md
        - book/11-correlation-matched-filtering.md

    - part: "Part IV: Analog Communication"
      chapters:
        - book/12-modulation.md
        - book/13-amplitude-modulation.md
        - book/14-frequency-modulation.md

    - part: "Part V: From Bits to Waveforms"
      chapters:
        - book/15-bits-symbols.md
        - book/16-linear-modulation-and-PAM.md
        - book/17-bpsk-qpsk-qam.md
        - book/18-pulse-shaping-and-matched-filtering.md

    - part: "Part VI: The Wireless Channel"
      chapters:
        - book/19-wireless-channel.md
        - book/20-channel-equalization.md

    - part: "Part VII: Teaching the Receiver Where to Look"
      chapters:
        - book/21-PLL-and-carrier-synchronization.md
        - book/22-symbol-timing-synchronization.md
        - book/23-frame-synchronization-and-packet-detection.md
        - book/24-building-complete-receiver.md

    - part: "Part VIII: OFDM and Multicarrier Communication"
      chapters:
        - book/25-OFDM.md

  page-footer:
    left: |
      SDR with GNU Radio · Dhrubjun Nath Saikia
    right: |
      Built with [Quarto](https://quarto.org/)

format:
  html:
    theme:
      light: cosmo
      dark: darkly

    css: styles.css

    toc: true
    toc-depth: 3

    number-sections: false

    grid:
      sidebar-width: 270px
      body-width: 860px
      margin-width: 250px
      gutter-width: 1.5rem